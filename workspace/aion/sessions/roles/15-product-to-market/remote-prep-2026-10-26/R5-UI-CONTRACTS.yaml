    record_identity: "c/p/n/o/s id"
    observable_state: "Same-pane conversation, note, project summary or reference facts; one-chip focus"
    evidence: "Source/T1; T3 unverified"
    assessment: "implemented_in_source"
  - key: "export.preview"
    journey: "J4"
    user_action: "Preview selected bundle"
    ui_handler: "runExport"
    api: "POST /api/v1/world/transfer/export"
    request_or_params: "{ids:['p-*'],mode:'references|transcript|full-saved',parts:{reasoning:false,toolActivity:false}}"
    backing_store: "WorldTransfer reads selected/outgoing dependency records"
    record_identity: "selected local world ids"
    observable_state: "Coverage, omissions, mode, user-controlled Download JSON; no write"
    evidence: "Source/T1/T2; real browser file unverified"
    assessment: "implemented_in_source"
  - key: "import.validate"
    journey: "J4"
    user_action: "Choose/paste JSON and Check"
    ui_handler: "readImportFile -> runCheck"
    api: "POST /api/v1/world/transfer/validate"
    request_or_params: "{bundle:{schema:'vivim.world-export/1'}}"
    backing_store: "WorldTransfer integrity validator; no write"
    record_identity: "bundle digest+idMap"
    observable_state: "Errors/omissions/digest/rewrites; 8MiB UI cap"
    evidence: "Source/T1/T2; real file unverified"
    assessment: "implemented_in_source"
  - key: "import.dryrun"
    journey: "J4"
    user_action: "Dry run"
    ui_handler: "runRestore({dryRun:true})"
    api: "POST /api/v1/world/transfer/restore"
    request_or_params: "{bundle:'checked bundle',digest:'verified digest',dryRun:true}"
    backing_store: "WorldTransfer simulation"
    record_identity: "planned imported IDs"
    observable_state: "Applied/skipped/failed/pending and no write"
    evidence: "Source/T1/T2; T3 unverified"
    assessment: "implemented_in_source"
  - key: "import.write"
    journey: "J4"
    user_action: "Confirm and write imported copies"
    ui_handler: "runRestore({dryRun:false})"
    api: "POST /api/v1/world/transfer/restore"
    request_or_params: "{bundle:'checked bundle',digest:'verified digest',dryRun:false,confirm:true}"
    backing_store: "VersionedStore imported snapshots + receipt"
    record_identity: "c-i*, p-*, n-*, o-*, s-*"
    observable_state: "Truthful full/partial/failure summary; conversations list reset, projects/notes not reset"
    evidence: "Source/T1/T2; T3 unverified"
    assessment: "postimport_continuity_partial"
