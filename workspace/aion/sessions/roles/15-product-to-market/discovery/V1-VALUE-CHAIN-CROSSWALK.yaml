# Product Agent R2 normalization: capability clusters and candidate user journeys; HOW stays with Z.ai
schema: "vivim.discovery.value-chain/1"
date: "2026-10-25"
owner: "AION PRODUCT Agent Role 15"
source_atlas: "VIVIM-CAPABILITY-ATLAS.yaml revision 2"
status: "candidate V1 shape, not approved implementation"
rules:
  - "Each cluster is a user outcome or integrity property, not an order to import code"
  - "A cluster can link many atlas signal IDs; 116 signals are not 116 distinct proven components"
  - "BUILD/HARVEST workshop waits for agreed V1 user journeys and verified capability gaps"
  - "Z.ai owns LOW/MED/HIGH HOW and may choose high-quality dependencies; MAX architecture stays local/Product Agent"
  - "New interactive Chrome/CDP work follows stable integrated VIVIM gate"
  - "Never infer production functionality from a README, feature inventory, source presence, or green fixture tests"
candidate_journeys:
  - id: "J-01"
    label: "Return to my previous AI work"
    stage: "candidate_v1_core"
    why: "One locally saved rich conversation opens after process restart with exact provider/source status; no account is needed to demonstrate internal continuity"
    clusters: ["C-01","C-02","C-03","C-04","C-16"]
    acceptance: "Fixture-backed rich conversation visible, restart app, reopen same local object and source links with unknowns preserved"
    blockers: ["unowned_read_model","ambiguous_source_identity"]
  - id: "J-02"
    label: "Organize a personal project"
    stage: "candidate_v1_core"
    why: "Turn disconnected AI conversations and artifacts into a project the user can return to"
    clusters: ["C-02","C-05","C-06","C-04"]
    acceptance: "Create workspace, link saved conversation and chosen artifact, add/edit note, reopen after restart"
    blockers: ["human_overlay_vs_evidence","relationship_persistence"]
  - id: "J-03"
    label: "Find and trust an answer"
    stage: "candidate_v1_core"
    why: "Search and jump back to exactly what was observed, rather than generic memory claims"
    clusters: ["C-04","C-07","C-08","C-16"]
    acceptance: "Search locally stored content, open exact source item, show observed/derived/user-edited distinction and coverage limitations"
    blockers: ["index_scope_not_equal_universal_search","identity_uncertainty"]
  - id: "J-04"
    label: "Take my chosen work with me"
    stage: "candidate_v1_core"
    why: "Meaningful ownership includes selective portable exports and recoverable imports without credentials"
    clusters: ["C-04","C-05","C-06","C-09"]
    acceptance: "Export selected workspace+content+provenance, import into clean app, compare contents and safe exclusions"
    blockers: ["existing_export_read_only","import_not_verified","sensitive_data_scope"]
  - id: "J-05"
    label: "Express a safe intention"
    stage: "vision_core_release_window_open"
    why: "Command system and agentic context library are strategically core but should never bypass authorization or block local reading utility"
    clusters: ["C-10","C-11","C-12","C-04"]
    acceptance: "Describe intent and preview scoped capability/uncertainty without external browser action; actual execution requires a later authorized runtime proof"
    blockers: ["syntactic_ok_not_authorization","unverified_symbol_compatibility"]
  - id: "J-06"
    label: "Use connected provider webapps"
    stage: "after_internal_stability"
    why: "External providers are essential to product identity, but adding Chrome interactivity before a stable local world increases coupled failure modes"
    clusters: ["C-12","C-13","C-02","C-03","C-04"]
    acceptance: "After stable gate, controlled Chrome/CDP test uses existing actor and proven identity; authenticated owner accounts separate"
    blockers: ["stability_gate","owner_auth_access"]
  - id: "J-07"
    label: "Explore knowledge visually and share across devices"
    stage: "later_exploration"
    why: "Spatial canvas and peer synchronization may be valuable, but their operational cost exceeds current minimal personal use case"
    clusters: ["C-08","C-14","C-15"]
    acceptance: "Small personal-use comparative pilot beats a list/table on the same data; sync only after local import/export integrity"
    blockers: ["unproven_personal_cognitive_payoff","external_keys_and_network_scope"]
