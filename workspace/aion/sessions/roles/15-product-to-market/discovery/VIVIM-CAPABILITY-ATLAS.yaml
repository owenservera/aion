# PRODUCT AGENT source-discovery YAML: signals are candidate judgments, never proof of implementation
schema: "vivim.discovery.atlas/1"
atlas_revision: 2
refinement_date: "2026-10-25"
record_semantics: "Each finding is a distinct product signal; multiple signals can refer to the same source; not unique proven components"
as_of: "2026-10-25"
owner: "AION Role 15 PRODUCT AGENT"
purpose: "Capture WHAT is useful, WHY, WHERE it lives, and WHAT is intriguing before BUILD-OR-HARVEST decisions"
policy:
  no_auto_adoption: true
  workshop_status: "not_started"
  v1_shape_status: "evolving"
  how_owner: "Z.ai for LOW/MED/HIGH; Product Agent/local models for MAX"
  engineering_principle: "better faster less garbage; dependencies are a pragmatic choice, not banned"
  browser_phase: "after stable integrated VIVIM"
  confidentiality: "Only public repository names and already-known selected product-private names are saved to public AION; nonselected private names omitted"
tag_dictionary:
  essential: "Likely core product outcome or integrity invariant; NOT proof it is implemented"
  looks_useful: "Promising practical user value; requires validation"
  interesting_how: "Interesting algorithm/pattern, may inform our independent implementation"
  interesting_idea: "Product possibility worth remembering; no V1 commitment"
  risky: "Implementation or design has scope/security/duplication concerns"
  unknown: "Repo or component exists; utility still unassessed"
status_dictionary:
  source_read: "Specific file text was directly inspected"
  source_located: "Path found via code search or existing source map; details not yet fully reviewed"
  readme_claim: "Repo README advertises behavior, not functional verification"
  previous_survey: "Earlier connected source review informed candidate; not refreshed in this pass"
  repo_discovered: "Repository name only; no implementation inference"
repository_census:
  accessible_count: 196
  public_count: 84
  private_count: 112
  listed_count: 103
  private_names_not_listed: 93
  coverage_note: "Repository-name search reached 2 populated pages and page 3 was empty; this is accessible GitHub search coverage, not confirmed exhaustive local/worktree code"
